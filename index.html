<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Attendance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #eef2f7;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 380px;

            margin-top: 15px;
            padding: 25px 20px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);

            text-align: center;

            display: block;
        }

        h1 {
            display: block;

            margin: 0 0 10px 0;

            font-size: 28px;
            color: #222;
        }

        #clock {
            display: block;

            margin: 10px 0 5px 0;

            font-size: 42px;
            font-weight: bold;

            color: #1f2937;
        }

        #date {
            display: block;

            margin-bottom: 25px;

            font-size: 15px;
            color: #6b7280;
        }

        /* TIME IN / TIME OUT */

        button {
            display: block;

            width: 100%;
            height: 65px;

            margin: 10px 0;

            border: none;
            border-radius: 14px;

            font-size: 21px;
            font-weight: bold;

            cursor: pointer;
        }

        .timein {
            background: #16a34a;
            color: white;
        }

        .timeout {
            background: #dc2626;
            color: white;
        }

        button:disabled {
            background: #d1d5db;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* ATTENDANCE RECORD */

        .record {
            display: block;

            width: 100%;

            margin-top: 25px;
            padding: 20px;

            background: #f8fafc;

            border-radius: 15px;

            text-align: left;
        }

        .record-title {
            display: block;

            text-align: center;

            font-size: 19px;
            font-weight: bold;

            margin-bottom: 18px;

            color: #111827;
        }

        .record p {
            display: flex;

            justify-content: space-between;
            align-items: center;

            width: 100%;

            margin: 12px 0;
            padding-bottom: 10px;

            border-bottom: 1px solid #e5e7eb;

            font-size: 15px;
        }

        .record span {
            font-weight: bold;
            color: #111827;
        }

        /* SMALL PHONE */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }

            .container {
                margin-top: 5px;
                padding: 22px 16px;
            }

            h1 {
                font-size: 26px;
            }

            #clock {
                font-size: 36px;
            }

            button {
                height: 60px;
                font-size: 19px;
            }

            .record p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Attendance</h1>

    <h2 id="clock"></h2>

    <div id="date"></div>

    <button id="timeInButton" class="timein" onclick="timeIn()">
        TIME IN
    </button>

    <button id="timeOutButton" class="timeout" onclick="timeOut()">
        TIME OUT
    </button>

    <div class="record">

        <div class="record-title">
            Today's Attendance
        </div>

        <p>
            <span>Morning Time In</span>
            <span id="morningIn">--:--</span>
        </p>

        <p>
            <span>Morning Time Out</span>
            <span id="morningOut">--:--</span>
        </p>

        <p>
            <span>Afternoon Time In</span>
            <span id="afternoonIn">--:--</span>
        </p>

        <p>
            <span>Afternoon Time Out</span>
            <span id="afternoonOut">--:--</span>
        </p>

    </div>

</div>

<script>

function today() {

    let d = new Date();

    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
}


function timeIn() {

    let now = new Date();
    let time = now.toLocaleTimeString();

    if (now.getHours() < 12) {

        if (localStorage.getItem("morningIn")) {
            alert("Morning Time In is already recorded.");
            return;
        }

        localStorage.setItem("morningIn", time);

        document.getElementById("morningIn").innerText = time;

    } else {

        if (localStorage.getItem("afternoonIn")) {
            alert("Afternoon Time In is already recorded.");
            return;
        }

        localStorage.setItem("afternoonIn", time);

        document.getElementById("afternoonIn").innerText = time;
    }

    localStorage.setItem("attendanceDate", today());

    updateButtons();
}


function timeOut() {

    let now = new Date();
    let time = now.toLocaleTimeString();

    if (now.getHours() < 12) {

        if (localStorage.getItem("morningOut")) {
            alert("Morning Time Out is already recorded.");
            return;
        }

        localStorage.setItem("morningOut", time);

        document.getElementById("morningOut").innerText = time;

    } else {

        if (localStorage.getItem("afternoonOut")) {
            alert("Afternoon Time Out is already recorded.");
            return;
        }

        localStorage.setItem("afternoonOut", time);

        document.getElementById("afternoonOut").innerText = time;
    }

    localStorage.setItem("attendanceDate", today());

    updateButtons();
}


function loadAttendance() {

    let savedDate = localStorage.getItem("attendanceDate");

    if (savedDate !== today()) {

        localStorage.removeItem("morningIn");
        localStorage.removeItem("morningOut");
        localStorage.removeItem("afternoonIn");
        localStorage.removeItem("afternoonOut");

        localStorage.setItem("attendanceDate", today());
    }

    document.getElementById("morningIn").innerText =
        localStorage.getItem("morningIn") || "--:--";

    document.getElementById("morningOut").innerText =
        localStorage.getItem("morningOut") || "--:--";

    document.getElementById("afternoonIn").innerText =
        localStorage.getItem("afternoonIn") || "--:--";

    document.getElementById("afternoonOut").innerText =
        localStorage.getItem("afternoonOut") || "--:--";
}


function updateClock() {

    let now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleTimeString();

    document.getElementById("date").innerText =
        now.toLocaleDateString(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });
}


function updateButtons() {

    let now = new Date();

    let timeInButton =
        document.getElementById("timeInButton");

    let timeOutButton =
        document.getElementById("timeOutButton");

    if (now.getHours() < 12) {

        timeInButton.disabled =
            localStorage.getItem("morningIn") !== null;

        timeOutButton.disabled =
            localStorage.getItem("morningOut") !== null;

    } else {

        timeInButton.disabled =
            localStorage.getItem("afternoonIn") !== null;

        timeOutButton.disabled =
            localStorage.getItem("afternoonOut") !== null;
    }
}


loadAttendance();

updateClock();

updateButtons();

setInterval(updateClock, 1000);

</script>

</body>
</html>
